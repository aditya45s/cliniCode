services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carekare
      POSTGRES_PASSWORD: carekare
      POSTGRES_DB: carekare
    ports:
      - "5432:5432"
    volumes:
      - carekare-postgres:/var/lib/postgresql/data
  ai-service:
    build: ./apps/ai-service
    ports:
      - "8000:8000"
    profiles: [full]
volumes:
  carekare-postgres:
